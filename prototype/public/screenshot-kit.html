<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MindMirror 小红书截图素材包</title>
<script>
  window.__API_BASE__ = '';
</script>
<link rel="stylesheet" href="styles.css">
<style>
  /* 截图预览页专用样式 */
  .shot-controls {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: #1a1a1d;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 12px 16px;
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 13px;
    color: rgba(235,232,227,0.7);
  }
  .shot-controls select, .shot-controls button {
    background: #0b0b0d;
    color: var(--text);
    border: 1px solid var(--line-strong);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .shot-controls button.primary {
    border-color: var(--accent-soft);
    color: var(--accent);
  }
  .shot-stage {
    margin-top: 64px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
    padding: 24px 0 120px;
  }
  .shot-label {
    color: var(--text-soft);
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-align: center;
  }
  .shot-frame {
    width: 390px;
    min-height: 520px;
    height: auto;
    background: var(--bg);
    border: 8px solid #222;
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .shot-frame.x34 {
    width: 390px;
    min-height: 520px;
    height: auto;
    border-radius: 32px;
  }
  /* 生成模式：用于 Playwright 批量导出，元素自然高度 */
  body.generate-mode .shot-controls {
    display: none;
  }
  body.generate-mode .shot-stage {
    margin-top: 0;
    padding: 0;
    gap: 0;
    align-items: flex-start;
  }
  body.generate-mode .shot-label {
    display: none;
  }
  body.generate-mode .shot-frame {
    width: 390px;
    height: auto;
    min-height: auto;
    border: none;
    border-radius: 0;
    box-shadow: none;
    margin-bottom: 0;
    overflow: visible;
  }
  body.generate-mode .shot-frame-inner {
    height: auto;
    min-height: auto;
    overflow: visible;
  }
  body.generate-mode .capture-target {
    position: relative;
    inset: auto;
    top: auto;
    left: auto;
    right: auto;
    bottom: auto;
    width: 100%;
    height: auto;
    min-height: auto;
    max-height: none;
    overflow: visible;
  }
  body.generate-mode .capture-target.qa-card-screen {
    display: block;
  }
  body.generate-mode .capture-target:not(.qa-card-screen) {
    display: flex;
    flex-direction: column;
  }
  body.generate-mode .qa-card {
    min-height: auto;
    flex: none;
    height: auto;
  }
  body.generate-mode .screen.snapshot-mode, body.generate-mode #screen-snapshot-m1, body.generate-mode .screen[id^="screen-snapshot-"] {
    position: relative;
    min-height: auto;
    height: auto;
    overflow: visible;
  }
  body.generate-mode .screen[id^="screen-snapshot-"] .dialogue-header {
    position: relative;
    flex-shrink: 0;
  }
  body.generate-mode .screen[id^="screen-snapshot-"] .snapshot-area {
    flex: none;
    min-height: auto;
    height: auto;
    overflow: visible;
    padding-bottom: 48px;
  }
  .shot-frame-inner {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    position: relative;
  }
  /* 覆盖 .screen fixed 定位，让截图容器正常渲染 */
  .shot-frame-inner .screen {
    position: absolute;
    inset: 0;
    opacity: 1;
    pointer-events: auto;
    display: flex;
    max-width: none;
    margin: 0;
  }
  .shot-frame-inner .screen:not(.active) {
    display: none;
  }
  /* 用于对话页截图：完全自适应内容高度 */
  .shot-frame-inner.dialogue-capture {
    height: auto !important;
    overflow: visible !important;
  }
  .shot-frame-inner.dialogue-capture .screen {
    position: relative !important;
    min-height: auto !important;
    height: auto !important;
    overflow: visible !important;
  }
  .shot-frame-inner.dialogue-capture .manual-dialogue-screen {
    display: flex;
    flex-direction: column;
  }
  .shot-frame-inner.dialogue-capture .dialogue-header {
    position: relative;
    flex-shrink: 0;
  }
  .shot-frame-inner.dialogue-capture .status-bar {
    position: relative;
    flex-shrink: 0;
  }
  .shot-frame-inner.dialogue-capture .question-area {
    min-height: auto;
    padding: 28px 24px;
    flex-shrink: 0;
  }
  .shot-frame-inner.dialogue-capture .manual-dialogue {
    flex: 1 0 auto;
    padding-bottom: 32px;
  }
  /* 快照页同样自适应高度 */
  .shot-frame-inner .screen#screen-snapshot-m1,
  .shot-frame-inner .screen[id^="screen-snapshot-"] {
    position: relative;
    min-height: 100%;
    height: auto;
    overflow: visible;
  }
  .shot-frame-inner .screen[id^="screen-snapshot-"] .snapshot-area {
    flex: 0 0 auto;
    min-height: auto;
    height: auto;
    overflow: visible;
    padding-bottom: 48px;
  }
  .shot-frame-inner.dialogue-capture .input-bar,
  .shot-frame-inner.dialogue-capture .completion-bar,
  .shot-frame-inner.dialogue-capture .scaffold-card {
    display: none !important;
  }
  .shot-frame-inner.dialogue-capture .light-beam {
    display: none;
  }
  /* 对话消息气泡覆盖，用于手动构造对话 */
  .manual-dialogue {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 24px;
  }
  .manual-msg {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .manual-msg.ai {
    align-items: flex-start;
  }
  .manual-msg.user {
    align-items: flex-end;
  }
  .manual-role {
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .manual-bubble {
    max-width: 88%;
    padding: 14px 18px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.7;
  }
  .manual-msg.ai .manual-bubble {
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border-bottom-left-radius: 4px;
    font-family: var(--sans);
  }
  .manual-msg.user .manual-bubble {
    background: var(--accent-glow);
    border: 1px solid var(--accent-soft);
    color: var(--accent);
    border-bottom-right-radius: 4px;
    font-family: var(--serif);
  }
  .manual-dialogue-screen .dialogue-header {
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .manual-dialogue-screen .question-area {
    display: none;
  }
  .snapshot-actions, .end-btn {
    display: none !important;
  }

  /* ==================== 3:4 单轮问答卡片 ==================== */
  .qa-card {
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    padding: 48px 32px 56px;
    box-sizing: border-box;
  }
  .qa-card-brand {
    text-align: center;
    margin-bottom: 56px;
  }
  .qa-card-brand-mark {
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 6px;
    color: var(--text-soft);
  }
  .qa-card-brand-sub {
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-faint);
    margin-top: 8px;
    text-transform: uppercase;
  }
  .qa-exchange {
    display: flex;
    flex-direction: column;
    gap: 42px;
    flex: 1;
    justify-content: center;
  }
  .qa-bubble-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .qa-bubble-wrap.ai {
    align-items: flex-start;
  }
  .qa-bubble-wrap.user {
    align-items: flex-end;
  }
  .qa-actor {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-faint);
    text-transform: uppercase;
  }
  .qa-avatar {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-family: var(--serif);
  }
  .qa-bubble-wrap.ai .qa-avatar {
    background: rgba(212,165,116,0.12);
    color: var(--accent);
    border: 1px solid var(--accent-soft);
  }
  .qa-bubble-wrap.user .qa-avatar {
    background: rgba(255,255,255,0.06);
    color: var(--text-soft);
    border: 1px solid var(--line-strong);
  }
  .qa-bubble {
    max-width: 92%;
    padding: 20px 22px;
    border-radius: 20px;
    font-size: 19px;
    line-height: 1.75;
    letter-spacing: 0.3px;
  }
  .qa-bubble-wrap.ai .qa-bubble {
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border-bottom-left-radius: 4px;
    font-family: var(--sans);
  }
  .qa-bubble-wrap.user .qa-bubble {
    background: var(--accent-glow);
    border: 1px solid var(--accent-soft);
    color: var(--accent);
    border-bottom-right-radius: 4px;
    font-family: var(--serif);
  }
  .qa-card-footer {
    margin-top: 48px;
    text-align: center;
  }
  .qa-card-footer-line {
    width: 40px;
    height: 1px;
    background: var(--line-strong);
    margin: 0 auto 14px;
  }
  .qa-card-footer-text {
    font-family: var(--serif);
    font-size: 13px;
    color: var(--text-soft);
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<div class="shot-controls">
  <label>素材：</label>
  <select id="materialSelect"></select>
  <label>视图：</label>
  <select id="viewSelect">
    <option value="all">全部</option>
    <option value="qa">问答卡</option>
    <option value="snapshot">决策快照</option>
  </select>
  <button class="primary" onclick="exportCurrent()">导出当前视图 PNG</button>
  <button onclick="exportAll()">导出全部</button>
</div>

<div class="shot-stage" id="shotStage"></div>

  // ============================================================
  //  渲染工具函数
  // ============================================================
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function nl2br(s) {
    return escapeHtml(s).replace(/\n/g, '<br>');
  }
  function clampConfidence(c) {
    const n = Number(c);
    if (!Number.isFinite(n)) return 7;
    return Math.max(1, Math.min(10, Math.round(n)));
  }
  function confidenceMeaning(c) {
    if (c <= 2) return '还很迷茫';
    if (c <= 4) return '有了方向，但心里没底';
    if (c <= 6) return '隐隐知道想怎么选';
    if (c <= 8) return '想清了大半';
    return '心里非常笃定';
  }

  function renderAnnotatedEssay(essay, annotations) {
    if (!essay) return '';
    if (!annotations || annotations.length === 0) return nl2br(essay);
    const sorted = [...annotations].sort((a, b) => (b.anchor?.length || 0) - (a.anchor?.length || 0));
    let html = escapeHtml(essay);
    for (const anno of sorted) {
      if (!anno.anchor) continue;
      const anchorHtml = escapeHtml(anno.anchor);
      const idx = html.indexOf(anchorHtml);
      if (idx >= 0) {
        const before = html.substring(0, idx);
        const after = html.substring(idx + anchorHtml.length);
        const label = { reflection: '反映', observation: '观察', gentle_prompt: '轻引导' }[anno.type] || anno.type;
        const span = `<span class="annotated">${anchorHtml}<span class="anno-tooltip"><span class="anno-tooltip-type">${escapeHtml(label)}</span><span class="anno-tooltip-comment">${escapeHtml(anno.comment)}</span></span></span>`;
        html = before + span + after;
      }
    }
    return html.replace(/\n/g, '<br>');
  }

  function renderV3SnapshotHtml(data, calDateStr, confidence) {
    const dotsHtml = Array.from({ length: 10 }, (_, i) =>
      `<div class="confidence-dot${i < confidence ? ' filled' : ''}"></div>`
    ).join('');

    const heroQuoteSection = data.hero_quote ? `
      <div class="snapshot-section">
        <div class="snapshot-eyebrow">你 说 出 来 最 重 的 那 句</div>
        <div class="snapshot-quote-block">
          <div class="snapshot-quote-mark">“</div>
          <div class="snapshot-quote">${escapeHtml(data.hero_quote)}</div>
          <div class="snapshot-quote-end">”</div>
        </div>
      </div>
    ` : '';

    const essayHtml = renderAnnotatedEssay(data.essay, data.annotations);

    return `
      <div class="snapshot-section">
        <div class="snapshot-eyebrow-row">
          <div class="snapshot-eyebrow">你 今 天 纠 结 的 是</div>
          ${data.type ? `<div class="snapshot-tag">${escapeHtml(data.type)}</div>` : ''}
        </div>
        <div class="snapshot-body title">${escapeHtml(data.title || '我的决策')}</div>
      </div>

      ${heroQuoteSection}

      <div class="snapshot-section">
        <div class="snapshot-eyebrow">今 天 的 对 话</div>
        <div class="snapshot-essay">${essayHtml}</div>
      </div>

      <div class="snapshot-section">
        <div class="snapshot-eyebrow">你 今 天 的 信 心</div>
        <div class="confidence-block">
          <div class="confidence-dots">${dotsHtml}</div>
          <div class="confidence-row">
            <div class="confidence-num"><span class="num-target">${confidence}</span><small> / 10</small></div>
            <div class="confidence-meaning">${confidenceMeaning(confidence)}</div>
          </div>
        </div>
      </div>

      <div class="calibration-block">
        <div class="calibration-eyebrow">校 准 提 醒</div>
        <div class="calibration-body">把这些放在心里。<br>3 个月后再回来，<br>看看那时候你怎么想。</div>
        <div class="calibration-date">${calDateStr}</div>
      </div>
    `;
  }

          </div>
          <div class="qa-card-footer">
            <div class="qa-card-footer-line"></div>
            <div class="qa-card-footer-text">MindMirror · 把事想完整</div>
          </div>
        </div>
      </section>
    `;
  }

  function renderSnapshot(shot) {
    const now = new Date();
    const calDate = new Date();
    calDate.setMonth(calDate.getMonth() + 3);
    const calDateStr = `${calDate.getFullYear()} 年 ${calDate.getMonth() + 1} 月 ${calDate.getDate()} 日`;
    const confidence = clampConfidence(shot.snapshot.confidence);
    return `
      <section class="screen active capture-target" id="screen-snapshot-${shot.id}">
        <header class="dialogue-header">
          <button class="back-btn">←</button>
          <span class="brand-mark">镜</span>
          <span class="top-bar-spacer"></span>
        </header>
        <main class="snapshot-area">${renderV3SnapshotHtml(shot.snapshot, calDateStr, confidence)}</main>
      </section>
    `;
  }

  // ============================================================
  //  页面渲染与导出
  // ============================================================
  function renderStage(view) {
    const stage = document.getElementById('shotStage');
    stage.innerHTML = '';
    const shotId = document.getElementById('materialSelect').value;
    const shots = shotId === 'all' ? SHOTS : SHOTS.filter(s => s.id === shotId);

    for (const shot of shots) {
      let panels;
      if (view === 'all') {
        panels = [];
        for (let i = 0; i < (shot.qaCards?.length || 0); i++) panels.push(`qa-${i}`);
        panels.push('snapshot');
      } else if (view === 'snapshot') {
        panels = ['snapshot'];
      } else if (view === 'qa') {
        panels = [];
        for (let i = 0; i < (shot.qaCards?.length || 0); i++) panels.push(`qa-${i}`);
      } else {
        panels = [view];
      }

      for (const panel of panels) {
        const isQA = panel.startsWith('qa-');
        const qaIndex = isQA ? parseInt(panel.split('-')[1], 10) : -1;
        const panelName = isQA ? `问答卡 ${qaIndex + 1}` : panel === 'snapshot' ? '决策快照' : panel;

        const label = document.createElement('div');
        label.className = 'shot-label';
        label.textContent = `${shot.name} · ${panelName}`;
        stage.appendChild(label);

        const frame = document.createElement('div');
        frame.className = 'shot-frame x34';
        frame.dataset.shot = shot.id;
        frame.dataset.panel = panel;

        const inner = document.createElement('div');
        inner.className = 'shot-frame-inner';
        inner.id = `frame-${shot.id}-${panel}`;

        if (isQA) inner.innerHTML = renderQACard(shot, qaIndex);
        else if (panel === 'snapshot') inner.innerHTML = renderSnapshot(shot);
        else if (panel === 'home') inner.innerHTML = renderHome(shot);
        else if (panel === 'dialogue') inner.innerHTML = renderDialogue(shot);

        frame.appendChild(inner);
        stage.appendChild(frame);
      }
    }
  }

  function initControls() {
    const materialSelect = document.getElementById('materialSelect');
    materialSelect.innerHTML = '<option value="all">全部</option>' +
      SHOTS.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

    materialSelect.addEventListener('change', () => renderStage(document.getElementById('viewSelect').value));
    document.getElementById('viewSelect').addEventListener('change', (e) => renderStage(e.target.value));

    // URL 参数模式：用于 Playwright 单独渲染某一张并 fullPage 截图
    const params = new URLSearchParams(location.search);
    const shotParam = params.get('shot');
    const panelParam = params.get('panel');
    if (shotParam && panelParam) {
      document.body.classList.add('generate-mode');
      document.querySelector('.shot-controls').style.display = 'none';
      const shot = SHOTS.find(s => s.id === shotParam);
      if (shot) {
        const stage = document.getElementById('shotStage');
        stage.innerHTML = '';
        stage.style.marginTop = '0';
        const frame = document.createElement('div');
        frame.className = 'shot-frame x34';
        const inner = document.createElement('div');
        inner.className = 'shot-frame-inner';
        inner.id = `frame-${shot.id}-${panelParam}`;
        if (panelParam.startsWith('qa-')) {
          inner.innerHTML = renderQACard(shot, parseInt(panelParam.split('-')[1], 10));
        } else if (panelParam === 'snapshot') {
          inner.innerHTML = renderSnapshot(shot);
        }
        frame.appendChild(inner);
        stage.appendChild(frame);
      }
      return;
    }
  }

  async function exportCurrent() {
    const frames = document.querySelectorAll('.shot-frame');
    if (!frames.length) return;
    for (const frame of frames) {
      await exportFrame(frame);
    }
  }

  async function exportAll() {
    // 临时渲染全部
    const prevView = document.getElementById('viewSelect').value;
    const prevShot = document.getElementById('materialSelect').value;
    document.getElementById('viewSelect').value = 'all';
    document.getElementById('materialSelect').value = 'all';
    renderStage('all');
    await new Promise(r => setTimeout(r, 300));
    await exportCurrent();
    document.getElementById('viewSelect').value = prevView;
    document.getElementById('materialSelect').value = prevShot;
    renderStage(prevView);
  }

  async function exportFrame(frame) {
    if (typeof html2canvas !== 'function') {
      alert('截图组件还没加载完');
      return;
    }
    const inner = frame.querySelector('.shot-frame-inner');
    const spinner = document.createElement('div');
    spinner.className = 'image-preview-spinner';
    spinner.textContent = '正在导出…';
    document.body.appendChild(spinner);

    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      // 临时展开父容器，让 html2canvas 捕获完整内容
      const originalFrameHeight = frame.style.height;
      const originalInnerHeight = inner.style.height;
      const originalInnerOverflow = inner.style.overflow;
      frame.style.height = 'auto';
      inner.style.height = 'auto';
      inner.style.overflow = 'visible';

      const canvas = await html2canvas(inner, {
        backgroundColor: '#0b0b0d',
        scale: 2,
        useCORS: true,
        logging: false,
        windowWidth: inner.scrollWidth,
        windowHeight: inner.scrollHeight,
      });

      frame.style.height = originalFrameHeight;
      inner.style.height = originalInnerHeight;
      inner.style.overflow = originalInnerOverflow;

      const link = document.createElement('a');
      link.download = `mindmirror-${frame.dataset.shot}-${frame.dataset.panel}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    } finally {
      spinner.remove();
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    initControls();
    renderStage('home');
  });
</script>
</body>
</html>
