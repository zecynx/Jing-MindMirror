<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>镜 · 真机截图演示</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* 真机截图演示页：只保留首页输入、对话、snapshot 三屏，去掉多余交互 */
  .demo-controls {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: rgba(11,11,13,0.96);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 13px;
    color: rgba(235,232,227,0.7);
  }
  .demo-controls select, .demo-controls button {
    background: #1a1a1d;
    color: var(--text);
    border: 1px solid var(--line-strong);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
    -webkit-appearance: none;
    appearance: none;
  }
  .demo-controls button.primary {
    border-color: var(--accent-soft);
    color: var(--accent);
  }
  .demo-hint {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-faint);
  }
  #demoStage {
    padding-top: 58px;
  }
  /* 隐藏 App 原生 footer 和多余按钮 */
  .home-footer, .snapshot-actions, .completion-bar, .status-bar, .input-bar, .scaffold-card {
    display: none !important;
  }
  /* 对话页改为自然滚动，方便真机截图 */
  #screen-dialogue {
    overflow-y: auto !important;
  }
  #screen-dialogue .question-area {
    min-height: auto;
    padding: 28px 24px 12px;
  }
  .demo-dialogue-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 0 24px 120px;
  }
  .demo-msg {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 88%;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .demo-msg.show {
    opacity: 1;
    transform: translateY(0);
  }
  .demo-msg.ai {
    align-self: flex-start;
  }
  .demo-msg.user {
    align-self: flex-end;
  }
  .demo-role {
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .demo-bubble {
    padding: 14px 18px;
    border-radius: 18px;
    font-size: 16px;
    line-height: 1.7;
  }
  .demo-msg.ai .demo-bubble {
    background: rgba(255,255,255,0.06);
    color: var(--text);
    border-bottom-left-radius: 4px;
    font-family: var(--sans);
  }
  .demo-msg.user .demo-bubble {
    background: var(--accent-glow);
    border: 1px solid var(--accent-soft);
    color: var(--accent);
    border-bottom-right-radius: 4px;
    font-family: var(--serif);
  }
</style>
</head>
<body>
<div class="demo-controls">
  <select id="shotSelect"></select>
  <button class="primary" id="playBtn">播放对话</button>
  <button id="snapshotBtn" disabled>看快照</button>
  <button id="resetBtn">重置</button>
  <span class="demo-hint">用手机截图</span>
</div>

<div id="demoStage">
  <!-- 首页 -->
  <section class="screen active" id="screen-home">
    <div class="home-content">
      <div class="logo">镜</div>
      <h2 class="ask">今天，<br>想聊点什么？</h2>
      <textarea class="home-input" id="homeInput" placeholder="随便说一件……" rows="3" readonly></textarea>
      <button class="hint-toggle on" data-on="true">
        <span class="hint-dot"></span>
        <span class="hint-label">显示提示</span>
        <span class="hint-sub">卡住时给一些思考方向</span>
      </button>
      <button class="home-btn ready" id="homeBtn">开始对话</button>
    </div>
  </section>

  <!-- 对话 -->
  <section class="screen" id="screen-dialogue">
    <div class="light-beam" id="lightBeam"></div>
    <header class="dialogue-header">
      <button class="back-btn" id="backBtn">←</button>
      <span class="brand-mark">镜</span>
      <span class="top-bar-spacer"></span>
    </header>
    <div class="understanding-bar" id="understandingBar"></div>
    <main class="question-area">
      <div class="question-text" id="questionText"></div>
    </main>
    <div class="demo-dialogue-list" id="dialogueList"></div>
    <div class="input-bar">
      <textarea class="reply-input" id="replyInput" placeholder="写下你的回答…" rows="1" disabled></textarea>
      <button class="reply-btn" id="replyBtn" disabled>↑</button>
    </div>
    <div class="completion-bar" id="completionBar">
      <div class="completion-hint">这次的思考，已经全部说出来了。</div>
      <button class="completion-btn" id="viewSnapshotBtn">看你的决策快照 →</button>
    </div>
    <div class="status-bar">
      <span class="phase-badge" id="phaseBadge"></span>
      <button class="history-toggle" id="historyToggle">回看 ↑</button>
    </div>
  </section>

  <!-- 快照 -->
  <section class="screen" id="screen-snapshot">
    <header class="dialogue-header">
      <button class="back-btn" id="snapshotBackBtn">←</button>
      <span class="brand-mark">镜</span>
      <span class="top-bar-spacer"></span>
    </header>
    <main class="snapshot-area" id="snapshotContent"></main>
  </section>
</div>

<script>

      snapshot: { title: '要不要辞职', type: '职业', hero_quote: '其实我怕的不是找不到工作，是怕我妈失望。', essay: '你今天来，带着这件事：\n\n我想辞职，但怕养不活自己。\n\n问了十几轮之后，你自己停了一下。\n\n说：其实我怕的不是找不到工作，是怕我妈失望。\n\n那句话出现得很晚。但可能是今天最重要的。', annotations: [{ anchor: '我想辞职，但怕养不活自己。', type: 'observation', comment: '这是今天的起点，也可能是表面问题。' }, { anchor: '其实我怕的不是找不到工作，是怕我妈失望。', type: 'reflection', comment: '如果它才是真问题，前面那些纠结是不是你想看到的最坏情况？' }], schema_version: 'v3', confidence: 6 }

        { role: 'user', text: '我不是在等他回我，我是在等自己不再害怕被拒绝。' },
      ],
      snapshot: { title: '今晚的小纠结', type: '其他', hero_quote: '我在等自己不再害怕被拒绝。', essay: '你今天来，带着这件事：\n\n我在犹豫明天要不要主动联系那个人。\n\n你说了害怕打扰，也说了害怕错过。\n\n然后你说：\n\n“我不是在等他回我，我是在等自己不再害怕被拒绝。”\n\n今晚的结论不是要不要发消息。是看见了自己还在练习这件事。', annotations: [{ anchor: '害怕打扰，也说了害怕错过', type: 'observation', comment: '两种恐惧在拉扯，都不是答案。' }, { anchor: '等自己不再害怕被拒绝', type: 'reflection', comment: '重要的不是消息发不发，是你和自己的关系。' }], schema_version: 'v3', confidence: 5 }
    },
    {
      id: 'm11', name: '素材11：Vibe Coding',
      homeInput: '我想做一个不一样的 AI 工具。',
      dialogue: [
        { role: 'ai', text: '你想做的不一样，是功能不一样，还是价值观不一样？' },
        { role: 'user', text: '功能上可能都差不多，但我想让它不抢答。' },
        { role: 'ai', text: '“不抢答”对你来说意味着什么？' },
        { role: 'user', text: '现在 AI 都在替人决定，我想把思考还给用户。' },
        { role: 'ai', text: '如果用户已经习惯被给答案，你怎么让他们愿意被提问？' },
        { role: 'user', text: '如果 AI 只会给答案，那思考就死了。我想让它把思考还给用户。' },
      ],
      snapshot: { title: '我要做一款只提问的 AI', type: '其他', hero_quote: '如果 AI 只会给答案，那思考就死了。', essay: '你今天来，带着这件事：\n\n我想做一个不一样的 AI 工具。\n\n你说了很多关于市场和效率的话。\n\n然后你说：\n\n“如果 AI 只会给答案，那思考就死了。我想让它把思考还给用户。”\n\n那一刻，这不是一个项目，是一个实验。', annotations: [{ anchor: '市场和效率', type: 'observation', comment: '理性的赛道分析，掩盖不了你想捍卫的东西。' }, { anchor: '把思考还给用户', type: 'reflection', comment: '你的差异化不是功能，是一种关系。' }], schema_version: 'v3', confidence: 7 }
    },
    {
      id: 'm12', name: '素材12：Agent',
      homeInput: '市面上的 AI 都在抢答，我想做一个只提问的 Agent。',
      dialogue: [
        { role: 'ai', text: '如果 Agent 不回答问题，那它完成的目标是什么？' },
        { role: 'user', text: '让用户自己找到答案。' },
        { role: 'ai', text: '那和一个好的心理咨询师有什么区别？' },
        { role: 'user', text: '它更轻、更即时、不会评判，也没有关系负担。' },
        { role: 'ai', text: '那它最好的状态，是让用户离不开它，还是让用户不再需要它？' },
        { role: 'user', text: '也许最好的 Agent，不是知道答案的那个，是让你终于敢说出自己答案的那个。' },
      ],
      snapshot: { title: '我要做一个不回答问题的 Agent', type: '其他', hero_quote: '让你终于敢说出自己答案的那个。', essay: '你今天来，带着这件事：\n\n市面上的 AI 都在抢答，我想做一个只提问的 Agent。\n\n你画了很多流程图，写了很多 prompt。\n\n然后你停下来，说：\n\n“也许最好的 Agent，不是知道答案的那个，是让你终于敢说出自己答案的那个。”\n\n那一刻，产品目标变了。', annotations: [{ anchor: '画了很多流程图，写了很多 prompt', type: 'observation', comment: '系统设计再完善，也比不上对目标的重新看见。' }, { anchor: '终于敢说出自己答案', type: 'reflection', comment: 'Agent 的终点不是效率，是人的勇气。' }], schema_version: 'v3', confidence: 7 }
    },
  ];

  const $ = id => document.getElementById(id);
  let currentShot = SHOTS[0];
  let playing = false;

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function nl2br(s) { return escapeHtml(s).replace(/\n/g, '<br>'); }
  function clampConfidence(c) { const n = Number(c); return Number.isFinite(n) ? Math.max(1, Math.min(10, Math.round(n))) : 7; }
  function confidenceMeaning(c) {
    if (c <= 2) return '还很迷茫';
    if (c <= 4) return '有了方向，但心里没底';
    if (c <= 6) return '隐隐知道想怎么选';
    if (c <= 8) return '想清了大半';
    return '心里非常笃定';
  }
  function renderAnnotatedEssay(essay, annotations) {
    if (!essay) return '';
    if (!annotations || annotations.length === 0) return nl2br(essay);
    const sorted = [...annotations].sort((a, b) => (b.anchor?.length || 0) - (a.anchor?.length || 0));
    let html = escapeHtml(essay);
    for (const anno of sorted) {
      if (!anno.anchor) continue;
      const anchorHtml = escapeHtml(anno.anchor);
      const idx = html.indexOf(anchorHtml);
      if (idx >= 0) {
        const before = html.substring(0, idx);
        const after = html.substring(idx + anchorHtml.length);
        const label = { reflection: '反映', observation: '观察', gentle_prompt: '轻引导' }[anno.type] || anno.type;
        const span = `<span class="annotated">${anchorHtml}<span class="anno-tooltip"><span class="anno-tooltip-type">${escapeHtml(label)}</span><span class="anno-tooltip-comment">${escapeHtml(anno.comment)}</span></span></span>`;
        html = before + span + after;
      }
    }
    return html.replace(/\n/g, '<br>');
  }
  function renderSnapshotHtml(data) {
    const calDate = new Date(); calDate.setMonth(calDate.getMonth() + 3);
    const calDateStr = `${calDate.getFullYear()} 年 ${calDate.getMonth() + 1} 月 ${calDate.getDate()} 日`;
    const confidence = clampConfidence(data.confidence);
    const dotsHtml = Array.from({ length: 10 }, (_, i) => `<div class="confidence-dot${i < confidence ? ' filled' : ''}"></div>`).join('');
    const heroQuoteSection = data.hero_quote ? `
      <div class="snapshot-section"><div class="snapshot-eyebrow">你 说 出 来 最 重 的 那 句</div>
        <div class="snapshot-quote-block"><div class="snapshot-quote-mark">“</div>
          <div class="snapshot-quote">${escapeHtml(data.hero_quote)}</div>
          <div class="snapshot-quote-end">”</div></div></div>` : '';
    const essayHtml = renderAnnotatedEssay(data.essay, data.annotations);
    return `
      <div class="snapshot-section"><div class="snapshot-eyebrow-row"><div class="snapshot-eyebrow">你 今 天 纠 结 的 是</div>${data.type ? `<div class="snapshot-tag">${escapeHtml(data.type)}</div>` : ''}</div><div class="snapshot-body title">${escapeHtml(data.title)}</div></div>
      ${heroQuoteSection}
      <div class="snapshot-section"><div class="snapshot-eyebrow">今 天 的 对 话</div><div class="snapshot-essay">${essayHtml}</div></div>
      <div class="snapshot-section"><div class="snapshot-eyebrow">你 今 天 的 信 心</div><div class="confidence-block"><div class="confidence-dots">${dotsHtml}</div><div class="confidence-row"><div class="confidence-num"><span class="num-target">${confidence}</span><small> / 10</small></div><div class="confidence-meaning">${confidenceMeaning(confidence)}</div></div></div></div>
      <div class="calibration-block"><div class="calibration-eyebrow">校 准 提 醒</div><div class="calibration-body">把这些放在心里。<br>3 个月后再回来，<br>看看那时候你怎么想。</div><div class="calibration-date">${calDateStr}</div></div>
    `;
  }
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
    document.documentElement.classList.toggle('snapshot-mode', id === 'screen-snapshot');
  }

  function loadShot(shot) {
    currentShot = shot;
    $('homeInput').value = shot.homeInput;
    $('questionText').textContent = shot.dialogue[0].text;
    $('dialogueList').innerHTML = '';
    $('snapshotContent').innerHTML = renderSnapshotHtml(shot.snapshot);
    $('snapshotBtn').disabled = true;
    showScreen('screen-home');
  }

  function addMessage(msg) {
    const div = document.createElement('div');
    div.className = `demo-msg ${msg.role}`;
    div.innerHTML = `<div class="demo-role">${msg.role === 'ai' ? '镜 · 提问' : '你 · 回答'}</div><div class="demo-bubble">${escapeHtml(msg.text)}</div>`;
    $('dialogueList').appendChild(div);
    requestAnimationFrame(() => div.classList.add('show'));
    $('questionText').textContent = msg.role === 'ai' ? msg.text : '';
    // 滚动到底部
    const dia = $('screen-dialogue');
    dia.scrollTop = dia.scrollHeight;
  }

  async function playDialogue() {
    if (playing) return;
    playing = true;
    $('playBtn').disabled = true;
    showScreen('screen-dialogue');
    $('dialogueList').innerHTML = '';
    for (const msg of currentShot.dialogue) {
      await new Promise(r => setTimeout(r, msg.role === 'ai' ? 900 : 600));
      addMessage(msg);
    }
    $('snapshotBtn').disabled = false;
    playing = false;
  }

  function init() {
    const sel = $('shotSelect');
    SHOTS.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.name;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', () => loadShot(SHOTS.find(s => s.id === sel.value)));

    $('homeBtn').addEventListener('click', playDialogue);
    $('playBtn').addEventListener('click', playDialogue);
    $('snapshotBtn').addEventListener('click', () => showScreen('screen-snapshot'));
    $('resetBtn').addEventListener('click', () => loadShot(currentShot));
    $('backBtn').addEventListener('click', () => showScreen('screen-home'));
    $('snapshotBackBtn').addEventListener('click', () => showScreen('screen-dialogue'));

    loadShot(SHOTS[0]);
  }

  init();
</script>
</body>
</html>
